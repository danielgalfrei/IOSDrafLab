# Builds the DraftLab iOS app. The project is managed with XcodeGen
# (project.yml -> DraftLab.xcodeproj, gitignored), not a Swift Package,
# so it's built with xcodebuild rather than `swift build`.

name: iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install XcodeGen
      run: brew install xcodegen
    - name: Generate Xcode project
      run: xcodegen generate
    - name: Build
      run: |
        xcodebuild build \
          -project DraftLab.xcodeproj \
          -scheme DraftLab \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator'
