name: DraftLab
options:
  bundleIdPrefix: com.danielgaleano
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  DraftLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/DraftLab
      - path: docs/module-index.json
        buildPhase: resources
    info:
      path: Sources/DraftLab/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielgaleano.draftlab
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  DraftLab:
    build:
      targets:
        DraftLab: all
    run:
      config: Debug
